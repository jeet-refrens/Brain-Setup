# Shared local infra for Refrens backend services.
#
# Provides the datastores serana and courier expect on their default ports:
#   - MongoDB        localhost:27017   (serana -> bizsuggest, courier -> courier)
#   - Elasticsearch  localhost:9200    (serana; config copied from serana/docker-compose.yml)
#   - Redis          localhost:6379    (serana; no password)
#
# The .env defaults in both repos already point at these ports, so no env changes
# are needed. Start with: docker compose up -d

services:
  mongo:
    image: mongo:6.0.6
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  elastic:
    image: elasticsearch:7.4.2
    restart: unless-stopped
    ports:
      - '9200:9200'
    environment:
      - ES_HEAP_SIZE=512m
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  elastic-data:
  redis-data:
