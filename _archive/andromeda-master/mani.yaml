# mani config — Refrens meta-repo. Manages all Refrens repos via the mani CLI.
# Repos are cloned as flat siblings of this file. `mani sync` clones; `--tags <t>` filters.

projects:
  serana:
    url: git@github.com:refrens/serana.git
    desc: Core backend API (Feathers.js, MongoDB, Elasticsearch, S3)
    tags: [backend, backend-core, backend-ai, full-stack]
