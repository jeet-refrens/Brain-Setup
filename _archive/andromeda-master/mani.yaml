    tags: [packages]

tasks:
  status:
    desc: git status across selected repos
    cmd: git status -sb
  pull:
    desc: git pull (fast-forward only) across selected repos
    cmd: git pull --ff-only
  install:
    desc: npm install across selected repos
    cmd: npm install
  build:
    desc: npm run build across selected repos
    cmd: npm run build
